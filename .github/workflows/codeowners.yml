name: Sync CODEOWNERS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-codeowners
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update contributor ownership
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          # Use GitHub's account associations for commits on the default branch.
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits?sha=$(git rev-parse HEAD)&per_page=100" \
            --jq '.[] | .author | select(.type == "User") | .login | ascii_downcase' \
            | sort -u > "$RUNNER_TEMP/contributors"
          gh api --paginate "repos/$GITHUB_REPOSITORY/collaborators?affiliation=direct&per_page=100" \
            --jq '.[] | select(.type == "User" and .permissions.push) | .login | ascii_downcase' \
            | sort -u > "$RUNNER_TEMP/writers"

          owner="${REPOSITORY_OWNER,,}"
          {
            printf '# Generated by the Sync CODEOWNERS workflow.\n'
            printf '* @%s' "$owner"
            while IFS= read -r login; do
              if [[ "$login" != "$owner" ]]; then
                printf ' @%s' "$login"
              fi
            done < <(comm -12 "$RUNNER_TEMP/contributors" "$RUNNER_TEMP/writers")
            printf '\n/.github/ @%s\n' "$owner"

            while IFS= read -r login; do
              if [[ "$login" != "$owner" ]]; then
                printf '# Contributor without write access: @%s\n' "$login"
              fi
            done < <(comm -23 "$RUNNER_TEMP/contributors" "$RUNNER_TEMP/writers")
          } > .github/CODEOWNERS

          git add -- .github/CODEOWNERS
          if git diff --cached --quiet; then
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: sync CODEOWNERS'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
