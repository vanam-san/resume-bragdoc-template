name: Release

# Auto-release on every update to master (direct push or PR merge).
# The workflow computes the next v1.N tag, skips when there is nothing
# new (no duplicates), and creates a GitHub Release with compiled PDFs
# and a What's Changed section.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check PDF builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pdf-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compile and check both PDFs
        run: |
          docker compose run --rm -T typst compile src/resume.typ src/resume.pdf
          docker compose run --rm -T typst compile src/bragdoc.typ src/bragdoc.pdf
          test -s src/resume.pdf
          test -s src/bragdoc.pdf

  release:
    name: Publish release PDFs
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-master
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # The upstream repo publishes fictional demos. Copies opt in with a repository variable.
      PUBLISH_BRAGDOC: ${{ vars.PUBLISH_BRAGDOC || (github.repository == 'vanam-san/resume-bragdoc-template' && 'true') || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Re-run guard: HEAD already carries a release tag.
          if git tag --points-at HEAD | grep -Eq '^v1\.[0-9]+$'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=head-already-tagged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strict v1.N tags only (stray v1.1.0-style tags are ignored by design).
          PREV_TAG=$(git tag --list 'v1.*' | grep -E '^v1\.[0-9]+$' | sort -V | tail -n1 || true)

          if [ -z "$PREV_TAG" ]; then
            NEW_TAG="v1.0"
          else
            MINOR=$(echo "$PREV_TAG" | sed -E 's/^v1\.([0-9]+)$/\1/')
            NEW_TAG="v1.$((MINOR + 1))"
            RANGE="${PREV_TAG}..HEAD"
          fi

          # The flag applies to this push's head commit only.
          if [[ "$(git log -1 --format=%B HEAD | tr '[:upper:]' '[:lower:]')" == *"[skip release]"* ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=skip-release-flag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Nothing new since the previous release -> no release.
          if [ -n "$PREV_TAG" ] && [ "$(git rev-list --count "$RANGE")" = "0" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-new-commits" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bump past any tag/release that already exists (never duplicate).
          TRIES=0
          while git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null \
            || gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            MINOR=$(echo "$NEW_TAG" | sed -E 's/^v1\.([0-9]+)$/\1/')
            NEW_TAG="v1.$((MINOR + 1))"
            TRIES=$((TRIES + 1))
            if [ "$TRIES" -gt 100 ]; then
              echo "::error::Could not find a free v1.N tag"
              exit 1
            fi
          done

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate date string
        if: steps.version.outputs.should_release == 'true'
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Compile release PDFs
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.new_tag }}
          RELEASE_DATE: ${{ steps.date.outputs.date }}
        run: |
          mkdir -p dist
          docker compose run --rm -T typst compile src/resume.typ "dist/Resume_${RELEASE_TAG}_${RELEASE_DATE}.pdf"
          if [[ "$PUBLISH_BRAGDOC" == "true" ]]; then
            docker compose run --rm -T typst compile src/bragdoc.typ "dist/Bragdoc_${RELEASE_TAG}_${RELEASE_DATE}.pdf"
          fi
          ls -la dist/*.pdf

      - name: Generate changelog
        if: steps.version.outputs.should_release == 'true'
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          PREV_TAG="${{ steps.version.outputs.prev_tag }}"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          # GitHub-generated notes (uses .github/release.yml categories).
          ARGS=(-f "tag_name=${NEW_TAG}")
          if [ -n "$PREV_TAG" ]; then
            ARGS+=(-f "previous_tag_name=${PREV_TAG}")
          fi
          GENERATED=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${ARGS[@]}" --jq .body 2>/dev/null || true)

          COMMITS=$(git log --pretty=format:'- %s (%h)' "$RANGE" --no-merges || true)
          if [ -z "$COMMITS" ]; then
            COMMITS="- No commits found (manual release)."
          fi

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          # GENERATED already contains "## What's Changed" and "**Full Changelog**".
          # Strip its Full Changelog line so each section is emitted only once:
          # What's Changed (from API) -> Commits -> single Full Changelog.
          GENERATED_BODY=$(printf '%s\n' "$GENERATED" | grep -v '^\*\*Full Changelog\*\*' || true)
          {
            if [ -n "$GENERATED_BODY" ]; then
              echo "$GENERATED_BODY"
              echo ""
            else
              echo "## What's Changed"
              echo ""
              echo "- No automated notes."
              echo ""
            fi
            echo "### Commits"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "---"
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${NEW_TAG}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${NEW_TAG}"
            fi
          } > "$NOTES_FILE"

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.new_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release - ${{ steps.version.outputs.new_tag }}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            dist/*.pdf
