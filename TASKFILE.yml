version: '3'

vars:
  TYPST: docker compose run --rm typst

tasks:
  default:
    desc: Compile both PDFs
    cmds:
      - task: compile

  pull:
    desc: Pull latest changes from Git
    cmds:
      - git pull

  dev:
    desc: Watch both documents and rebuild PDFs on save
    watch: true
    method: none
    sources: [src/**/*.typ, src/**/*.jpg, src/**/*.jpeg, src/**/*.png, src/fonts/*.ttf, compose.yaml]
    cmds:
      - task: compile

  dev-resume:
    desc: Watch and rebuild the resume
    watch: true
    method: none
    sources: [src/resume.typ, src/functions.typ, src/**/*.jpg, src/**/*.jpeg, src/**/*.png, src/fonts/*.ttf, compose.yaml]
    cmds:
      - task: compile-resume

  dev-bragdoc:
    desc: Watch and rebuild the brag document
    watch: true
    method: none
    sources: [src/bragdoc.typ, src/functions.typ, src/**/*.jpg, src/**/*.jpeg, src/**/*.png, src/fonts/*.ttf, compose.yaml]
    cmds:
      - task: compile-bragdoc

  compile:
    desc: Compile both PDFs
    deps: [compile-resume, compile-bragdoc]

  compile-resume:
    desc: Compile the resume PDF
    cmds:
      - '{{.TYPST}} compile src/resume.typ src/resume.pdf'

  compile-bragdoc:
    desc: Compile the brag document PDF
    cmds:
      - '{{.TYPST}} compile src/bragdoc.typ src/bragdoc.pdf'

  previews:
    desc: Refresh the first-page PNG previews
    cmds:
      - '{{.TYPST}} compile --pages 1 --ppi 150 src/resume.typ preview-resume.png'
      - '{{.TYPST}} compile --pages 1 --ppi 150 src/bragdoc.typ preview-bragdoc.png'
